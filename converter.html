<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>텍스트 변환기</title>
<style>
:root{--ink:#1d1d1f;--sub:#86868b;--line:#ececf1;--card:#fafafc;--blue:#d3e3ff;--blue-ink:#3b5b9a;--mint:#c9f1dd;--mint-ink:#2c7653}
*{box-sizing:border-box;font-size:12px}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.75;letter-spacing:-.01em;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:1120px;margin:0 auto;padding:32px 20px 72px}
header{margin-bottom:22px}
h1{font-weight:700;margin:0;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--sub)}
h2{font-weight:600;color:var(--sub);margin:0 0 10px}
.menu{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:20px}
.tplrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tplrow select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;cursor:pointer}
.tplinfo{color:var(--sub)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.empty{color:var(--sub);padding:6px 2px}
.char{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;animation:pop .45s ease both}
.cn{color:var(--sub);margin-bottom:8px;word-break:break-all}
.row{display:flex;gap:10px;margin-top:10px}
.row label{flex:1;color:var(--sub);display:flex;flex-direction:column;gap:4px}
input[type=text],input[type=number]{width:100%;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s}
input[type=text]:focus,input[type=number]:focus,textarea:focus{border-color:#b9d0ff;box-shadow:0 0 0 4px #e8f0ff}
input[type=color]{width:100%;height:42px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer}
.row select{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline:none;cursor:pointer;height:42px}
.pv mark{padding:1px 3px;border-radius:3px;color:inherit}
.pv{margin-top:10px;font-weight:700;transition:color .25s;word-break:break-all}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"s r" "a a";gap:16px}
.s{grid-area:s}.r{grid-area:r}
.pane{display:flex;flex-direction:column;min-width:0}
textarea,.out{width:100%;height:56vh;min-height:300px;font:inherit;line-height:1.75;padding:16px;border:1px solid var(--line);border-radius:20px;background:#fff;color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s}
textarea{resize:vertical}
.out{background:#fff;overflow:auto;word-break:break-word}
.out:empty::before{content:attr(data-ph);color:#a1a1a6}
.tx{white-space:pre-wrap}
.actions{grid-area:a;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.actions button{font:inherit;font-weight:600;border:0;border-radius:14px;padding:13px 30px;cursor:pointer;transition:background .35s,color .35s,transform .2s;-webkit-tap-highlight-color:transparent}
.actions button:active{transform:scale(.97)}
#go{background:var(--blue);color:var(--blue-ink);min-width:150px}
#cp{background:#f1f1f5;color:#55555a}
button.done{background:var(--mint)!important;color:var(--mint-ink)!important}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:760px){.wrap{padding:24px 16px 56px}.grid{grid-template-columns:1fr;grid-template-areas:"s" "a" "r"}textarea,.out{height:360px;min-height:320px}.actions button{flex:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hb{margin:20px 0}.hb:first-child{margin-top:0}.hb:last-child{margin-bottom:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>텍스트 변환기</h1>
    <p>붙여넣고 변환하면 등장인물이 자동으로 분류돼요.</p>
  </header>

  <section class="menu">
    <h2>상태창 디자인</h2>
    <div class="tplrow"><select id="tpl" aria-label="상태창 디자인"></select><span class="tplinfo" id="tplinfo"></span></div>
    <h2>대사 꾸미기 (전체 한 번에)</h2>
    <div class="tplrow"><select id="gmode" aria-label="대사 꾸미기 전체"></select><span class="tplinfo">아래 등장인물마다 따로 바꿀 수도 있어요.</span></div>
    <h2>등장인물 옵션</h2>
    <div class="chars" id="chars"><div class="empty">변환하기를 누르면 등장인물이 여기에 나타나요.</div></div>
  </section>

  <section class="grid">
    <div class="pane s"><h2>변환 전</h2><textarea id="src" placeholder="변환할 텍스트를 붙여넣으세요"></textarea></div>
    <div class="actions">
      <button id="go" type="button">변환하기</button>
      <button id="cp" type="button">복사</button>
    </div>
    <div class="pane r"><h2>변환 후</h2><div class="out" id="out" data-ph="변환 결과가 여기에 표시돼요"></div></div>
  </section>
</div>

<script>
const $=id=>document.getElementById(id);
const PAL=['#ffb07c','#9ec5fe','#b8e6c9','#d7b8f5','#ffc6d9','#f6dd8f'];
const NONAME='__noname__';
let blocks=[],chars=new Map(),raw='',force='auto';
const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const E=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#039;').replace(/"/g,'&quot;');

/* ───────── 상태창 태그 읽기 (<SN ... />, <Amond ... />, <Apogee ... />) ───────── */
function parseAttrs(s,p){
  const a={},n=s.length,ws=()=>{while(p<n&&/\s/.test(s[p]))p++};
  while(p<n){
    ws();
    if(s.startsWith('/>',p))return{a,end:p+2};
    if(s[p]==='>')return{a,end:p+1};
    const km=/^[A-Za-z_][\w-]*/.exec(s.slice(p,p+80));
    if(!km)return null;
    const k=km[0];p+=k.length;ws();
    if(s[p]!=='='){a[k]='true';continue}
    p++;ws();
    const q=s[p];
    if(q==='"'||q==="'"){const e=s.indexOf(q,p+1);if(e<0)return null;a[k]=s.slice(p+1,e);p=e+1}
    else if(q==='{'){
      let d=0,e=p;
      for(;e<n;e++){if(s[e]==='{')d++;else if(s[e]==='}'&&!--d)break}
      if(e>=n)return null;
      let v=s.slice(p+1,e).trim();const sm=/^(["'`])([\s\S]*)\1$/.exec(v);if(sm)v=sm[2];
      a[k]=v;p=e+1;
    }else{const vm=/^[^\s>]+/.exec(s.slice(p,p+200));if(!vm)return null;a[k]=vm[0];p+=vm[0].length}
  }
  return null;
}
function extractStatus(src){
  const sts=[],keys=Object.keys(TPL);
  const re=new RegExp('<('+keys.join('|')+')(?=[\\s/>])','gi');
  let out='',last=0,m;
  while((m=re.exec(src))){
    const r=parseAttrs(src,m.index+m[0].length);
    if(!r)continue;
    const a=r.a;a._id='st'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    out+=src.slice(last,m.index)+'\n@@STATUS'+sts.length+'@@\n';
    sts.push({tag:keys.find(k=>k.toLowerCase()===m[1].toLowerCase()),a});
    last=r.end;re.lastIndex=r.end;
  }
  return{src:out+src.slice(last),sts};
}

/* ───────── 본문 읽기 ───────── */
function parse(src){
  const ex=extractStatus(src.replace(/\r/g,''));
  src=ex.src.replace(/<br\s*\/?>\s*(?=\()/gi,'\n');
  const L=src.split('\n'),out=[];
  // 대사 다음 줄의 번역 찾기
  const grabTr=i=>{
    let j=i+1;while(j<L.length&&!L[j].trim())j++;
    const n=L[j]||'';let t;
    if(t=n.match(/^\s*\(([\s\S]*)\)\s*$/))return{tr:t[1],i:j};
    if(t=n.match(/^\s*\{\{\d+:\{\{#[0-9a-fA-F]{3,8}:\*\*([\s\S]*?)\*\*\}\}\}\}\s*$/))return{tr:t[1],i:j};
    return{tr:null,i};
  };
  for(let i=0;i<L.length;i++){
    let l=L[i];
    const sm=l.trim().match(/^@@STATUS(\d+)@@$/);
    if(sm){out.push({t:'st',s:ex.sts[+sm[1]]});continue}
    if(/\{\{img::[^}]*\}\}/.test(l)){l=l.replace(/\{\{img::[^}]*\}\}/g,'');if(!l.trim())continue}
    // 이름 | "대사"  (이름에 ** 가 붙어 있어도 인식)
    const m=l.match(/^\s*(?:\*\*)?([^|｜│*"“”「『\n]{1,30}?)(?:\*\*)?\s*[|｜│]\s*(.*["“「『].*)$/);
    if(m){
      const r=grabTr(i);i=r.i;
      out.push({t:'d',n:m[1].trim(),l:m[2].replace(/(<br\s*\/?>\s*)+$/i,'').trim(),tr:r.tr});continue;
    }
    // "대사" (이름 없이 따옴표로 시작하는 줄)
    if(/^\s*["“「『]/.test(l)){
      const r=grabTr(i);i=r.i;
      out.push({t:'d',n:NONAME,l:l.replace(/(<br\s*\/?>\s*)+$/i,'').trim(),tr:r.tr});continue;
    }
    out.push({t:'x',s:/^\s*\*([^*].*[^*]|[^*])\*\s*$/.test(l)?l.replace(/^(\s*)\*(.*)\*(\s*)$/,'$1$2$3'):l.replace(/^(\s*)_(.*)_(\s*)$/,'$1$2$3')});
  }
  return out;
}

/* ───────── 상태창 1: APOGEE (원본 그대로) ───────── */
const APL_CSS="\n  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');\n  .apl{--bg:#0e0b07;--bg2:#141009;--card:#1b1811;--card2:#201c14;--line:#4a4436;--line2:#2c2820;--line3:#6b6250;\n    --acc:#dfb840;--acc2:#f0cc55;--ink:#fdf6e6;--ink2:#ded9cc;--ink3:#cdc7b8;--soft:#f2e2b8;--mute:#9d9686;--red:#a33636;\n    max-width:440px;margin:0 auto;box-sizing:border-box;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;\n    font-size:12px;color:var(--ink2);background:var(--bg);border:1px solid #575044;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.7);\n    word-break:keep-all;overflow-wrap:break-word;text-align:left;letter-spacing:0;line-height:normal}\n  .apl *{box-sizing:border-box}\n  .apl-tag{display:inline-block;background:var(--acc);color:#14100a;font-weight:800;font-size:9.5px;letter-spacing:2px;padding:5px 11px}\n  .apl-head{background:linear-gradient(165deg,#1a1409 0%,var(--bg) 70%);padding:18px 16px;border-bottom:1px solid var(--line)}\n  .apl-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}\n  .apl-hq{font-size:9px;letter-spacing:2px;color:var(--mute)}\n  .apl-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--acc);padding:15px 16px}\n  .apl-rel{display:inline-block;background:var(--acc);color:#14100a;font-size:10px;font-weight:800;padding:3px 9px;margin-bottom:9px}\n  .apl-names{font-weight:800;font-size:19px;color:var(--ink);letter-spacing:-.3px;margin-bottom:6px}\n  .apl-names span{color:var(--acc);font-weight:400;margin:0 4px}\n  .apl-meta{font-size:11px;color:var(--mute);font-weight:500}\n  .apl-toggle{display:block;width:100%;border:0;background:var(--acc);color:#14100a;text-align:center;padding:11px;font-weight:800;letter-spacing:3px;font-size:11px;cursor:pointer;font-family:inherit}\n  .apl-sec{padding:18px 16px;border-top:1px solid var(--line2)}\n  .apl-sec.a{background:#100c07}.apl-sec.b{background:var(--bg2)}\n  .apl-sec .apl-tag{margin-bottom:13px}\n  .apl-row{display:flex;gap:7px}\n  .apl-stat{flex:1;background:var(--card);border:1px solid var(--line);padding:11px 4px;text-align:center}\n  .apl-stat-l{font-size:8.5px;font-weight:700;letter-spacing:1.5px;color:var(--mute)}\n  .apl-stat-v{font-weight:800;font-size:18px;color:var(--ink);margin-top:5px}\n  .apl-stat-v.g{color:var(--acc)}\n  .apl-aff{background:#221c12;border:1px solid var(--line3);padding:11px 14px;margin-top:7px}\n  .apl-aff-top{display:flex;justify-content:space-between;align-items:center}\n  .apl-aff-l{font-size:9px;font-weight:700;letter-spacing:2px;color:#a89467}\n  .apl-aff-v{font-weight:800;font-size:13px;color:var(--acc2)}\n  .apl-bar{height:4px;background:#2b2519;margin-top:8px}\n  .apl-bar i{display:block;height:100%;background:linear-gradient(90deg,#a8862a,var(--acc2))}\n  .apl-who{flex:1;min-width:0;background:var(--card2);border:1px solid var(--line);border-top:2px solid var(--acc);padding:12px 11px}\n  .apl-who.pc{border-top-color:#827d70}\n  .apl-who-n{text-align:center;font-weight:800;font-size:12.5px;color:var(--acc);margin-bottom:6px}\n  .apl-who.pc .apl-who-n{color:#e8ddc4}\n  .apl-kao{text-align:center;font-family:sans-serif;font-size:15px;color:var(--soft);border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:9px;overflow-wrap:anywhere}\n  .apl-k{font-size:9px;font-weight:700;color:var(--mute);letter-spacing:1.5px}\n  .apl-v{font-size:11.5px;font-weight:500;line-height:1.55;margin:2px 0 8px}\n  .apl-v:last-child{margin-bottom:0}\n  .apl-mind{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--acc);padding:13px 14px;font-size:12.5px;line-height:1.75;color:var(--soft);font-style:italic}\n  .apl-nsfw{background:var(--card2);border:1px solid var(--line3);padding:11px 13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}\n  .apl-nk{font-size:8.5px;letter-spacing:1.5px;color:var(--mute);font-weight:700;margin-right:5px}\n  .apl-nv{font-weight:800;font-size:12px;color:var(--soft)}\n  .apl-nv.g{color:var(--acc)}\n  .apl-pill{font-weight:800;font-size:10px;letter-spacing:1px;padding:2px 9px;border:1px solid var(--line3);color:var(--mute)}\n  .apl-pill.on{border-color:var(--acc);color:var(--acc);background:rgba(223,184,64,.08)}\n  .apl-sfw{font-size:11px;color:var(--mute);letter-spacing:2px;font-weight:700}\n  .apl-tabs{display:flex;gap:3px;border-bottom:1px solid var(--line3)}\n  .apl-tab{text-align:center;user-select:none;flex:1 1 0;min-width:0;border:1px solid var(--line);border-bottom:0;background:var(--card);color:var(--mute);font-family:inherit;font-weight:800;font-size:10.5px;letter-spacing:2px;padding:8px 4px;cursor:pointer;position:relative;top:1px}\n  .apl-panel{background:var(--card);border:1px solid var(--line3);border-top:0;padding:14px;line-height:1.7;min-height:96px}\n  .apl-chip{display:inline-block;background:#2b2519;border:1px solid var(--line3);color:var(--acc);font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 7px;margin-right:7px}\n  .apl-line{margin-bottom:8px}\n  .apl-dash{border-top:1px dashed #575044;margin:11px 0}\n  .apl-num{display:flex;gap:8px;padding:3px 0}\n  .apl-num b{color:var(--acc);font-size:11px;flex-shrink:0}\n  .apl-comm-t{font-weight:800;font-size:13.5px;line-height:1.5;color:var(--ink);margin:8px 0 10px}\n  .apl-cmt{border-top:1px dashed #575044;padding:9px 0 0;margin-top:9px}\n  .apl-cmt-h{font-size:9.5px;color:var(--acc);letter-spacing:.5px;font-weight:700;margin-bottom:2px}\n  .apl-cmt-b{font-size:11.5px;color:var(--ink3)}\n  .apl-red{display:inline-block;background:var(--red);color:var(--ink);font-size:9px;font-weight:800;letter-spacing:1px;padding:2px 8px}\n  .apl-q{font-size:11.5px;color:var(--mute);margin-bottom:8px}\n  .apl-q b{color:var(--acc);margin-right:6px}\n  .apl-a{font-size:12.5px;color:var(--soft);font-weight:600}\n  .apl-a b{color:var(--acc);margin-right:6px;font-style:normal}\n  .apl-atr{font-size:11.5px;color:var(--mute);margin-top:4px;padding-left:22px}\n  .apl-empty{color:#6e6a5c}\n  .apl-foot{background:#0a0805;border-top:1px solid var(--line);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;font-size:9px;font-weight:700;letter-spacing:1.5px;color:#6e6a5c}\n  .apl-foot span:last-child{color:var(--mute)}\n  .apl-det>summary{list-style:none}\n  .apl-det>summary::-webkit-details-marker{display:none}\n  .apl .lo{display:none}\n  .apl-det[open] .lo{display:inline}\n  .apl-det[open] .lc{display:none}\n  .apl-r{display:none}\n  .apl .pn{display:none}\n  .apl-r.r-schedule:checked~.apl-panel .pn-schedule{display:block}.apl-r.r-schedule:checked~.apl-tabs .tb-schedule{background:var(--acc);border-color:var(--acc);color:#14100a}.apl-r.r-promise:checked~.apl-panel .pn-promise{display:block}.apl-r.r-promise:checked~.apl-tabs .tb-promise{background:var(--acc);border-color:var(--acc);color:#14100a}.apl-r.r-tmi:checked~.apl-panel .pn-tmi{display:block}.apl-r.r-tmi:checked~.apl-tabs .tb-tmi{background:var(--acc);border-color:var(--acc);color:#14100a}.apl-r.r-community:checked~.apl-panel .pn-community{display:block}.apl-r.r-community:checked~.apl-tabs .tb-community{background:var(--acc);border-color:var(--acc);color:#14100a}.apl-r.r-interview:checked~.apl-panel .pn-interview{display:block}.apl-r.r-interview:checked~.apl-tabs .tb-interview{background:var(--acc);border-color:var(--acc);color:#14100a}";
function apogeeHtml(s){
  const v=k=>E((s[k]||'').trim()),L=k=>(s[k]||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const num=(k,st)=>L(k).map((x,i)=>`<div class="apl-num"><b>${String(i+1).padStart(2,'0')}</b><span${st||''}>${E(x)}</span></div>`).join('');
  const rel=v('relation'),np=v('npc'),pc=v('pc'),meta=['date','time','location','temperature','weather'].map(k=>v(k)).filter(Boolean).join(' · ');
  const names=np&&pc?`${np}<span>⨯</span>${pc}`:np||pc;
  const card=(rel||names||meta)?`<div class="apl-card">${rel?`<div class="apl-rel">${rel}</div>`:''}${names?`<div class="apl-names">${names}</div>`:''}${meta?`<div class="apl-meta">${meta}</div>`:''}</div>`:'';
  const secs=[];
  const stat=(k,l,g)=>v(k)?`<div class="apl-stat"><div class="apl-stat-l">${l}</div><div class="apl-stat-v${g?' g':''}">${v(k)}</div></div>`:'';
  const af=parseFloat(s.affection),sr=stat('daysMet','DAYS MET')+stat('daysTogether','TOGETHER',1);
  const aff=v('affection')?`<div class="apl-aff"><div class="apl-aff-top"><span class="apl-aff-l">SENTIMENT</span><span class="apl-aff-v">${v('affection')}</span></div><div class="apl-bar"><i style="width:${isNaN(af)?0:Math.max(0,Math.min(100,af))}%"></i></div></div>`:'';
  if(sr||aff)secs.push(c=>`<div class="apl-sec ${c}"><div class="apl-tag">STATUS</div>${sr?`<div class="apl-row">${sr}</div>`:''}${aff}</div>`);
  const kv=(k,l)=>v(k)?`<div class="apl-k">${l}</div><div class="apl-v">${v(k)}</div>`:'';
  const who=(n,kao,o,po,cl)=>{const b=(v(kao)?`<div class="apl-kao">${v(kao)}</div>`:'')+kv(o,'OUTFIT')+kv(po,'POSE');return(v(n)||b)?`<div class="apl-who${cl}">${v(n)?`<div class="apl-who-n">${v(n)}</div>`:''}${b}</div>`:''};
  const wr=who('npc','npcKaomoji','npcOutfit','npcPose','')+who('pc','pcKaomoji','pcOutfit','pcPose',' pc');
  if(wr)secs.push(c=>`<div class="apl-sec ${c}"><div class="apl-tag">PRESENT</div><div class="apl-row" style="gap:9px">${wr}</div></div>`);

  const P={},now=v('scheduleNow'),nx=v('scheduleNext'),w=num('npcWants');
  P.schedule=(now?`<div class="apl-line"><span class="apl-chip">NOW</span>${now}</div>`:'')+(nx?`<div class="apl-line"><span class="apl-chip">NEXT</span>${nx}</div>`:'')+((now||nx)&&w?'<div class="apl-dash"></div>':'')+(w?`<div class="apl-k" style="margin-bottom:4px">DESIRE</div>${w}`:'');
  P.promise=num('promises',' style="color:var(--soft);font-weight:600"');

  const cl=L('communityComments'),ct=v('communityTitle');let cm='';
  for(let i=0;i<cl.length;i+=2)cm+=`<div class="apl-cmt"><div class="apl-cmt-h">${E(cl[i])}</div><div class="apl-cmt-b">${E(cl[i+1]||'')}</div></div>`;
  P.community=(ct||cm)?`<span class="apl-red">BABYLON</span>${ct?`<div class="apl-comm-t">${ct}</div>`:''}${cm}`:'';
  const q=v('interviewQ'),a=v('interviewA'),tr=v('interviewATr');
  P.interview=(q?`<div class="apl-q"><b>Q.</b>${q}</div>`:'')+(a?`<div class="apl-a"><b>A.</b>${a}</div>`:'')+(tr?`<div class="apl-atr">(${tr})</div>`:'');
  const tabs=[['schedule','SCH'],['promise','PRM'],['tmi','TMI'],['community','COM'],['interview','INT']].filter(t=>P[t[0]]);

/* ───────── 상태창 2·3: SN / AMOND 공통 틀 (JSX → JS 없는 HTML) ───────── */
const nlv=s=>String(s||'').replace(/&#10;|&#x0*a;/gi,'\n').replace(/<br\s*\/?>/gi,'\n').replace(/\\n/g,'\n');
const H=s=>E(nlv(s).trim()).replace(/\n/g,'<br>');
const LN=s=>nlv(s).split(/\r?\n/).map(v=>v.trim()).filter(Boolean);
const pct=s=>{const n=parseInt(String(s).replace(/[^0-9-]/g,''),10);return isNaN(n)?null:Math.max(0,Math.min(100,n))};
const withPct=s=>{const t=String(s||'').trim();if(!t)return'-';return/^-?\d+(\.\d+)?$/.test(t)?t+'%':t};
const dPlus=s=>{const t=String(s||'').trim();if(!t)return'-';return/^d\s*\+/i.test(t)?t.replace(/^d\s*\+\s*/i,'D+'):'D+'+t};

/* 공통 틀: DIARY 탭 · OUTFIT/POSE 칸은 모든 상태창에서 숨김 */
function boxHtml(cfg,a){
  const p=cfg.p,raw=k=>String(a[k]||'').trim(),v=k=>H(a[k]);
  const empty=`<span class="${p}-empty">-</span>`,or=(k,d)=>raw(k)?v(k):d;
  const meta=['date','time','temperature','weather'].map(raw).filter(Boolean).map(E).join(' · ');
  const loc=raw('location');
  const chips=cfg.chips(a).map(([ic,val])=>`<div class="${p}-chip"><span>${ic}</span><span>${E(val)}</span></div>`).join('');
  const wants=LN(a.npcWants).slice(0,3);
  const P={};
  P.status=`<div><div class="${p}-lbl">${cfg.icon} ${cfg.NPC}</div><div class="${p}-mind">${or('npcMind','...')}</div></div>`
    +`<div><div class="${p}-lbl">WANT TO DO</div><div class="${p}-box">${wants.length?wants.map((w,i)=>`<div class="${p}-num"><b>0${i+1}</b><span>${E(w)}</span></div>`).join(''):empty}</div></div>`
    +`<div><div class="${p}-lbl">TMI</div><div class="${p}-box">${or('tmi',empty)}</div></div>`;
  if(cfg.nsfw){
    const lr=raw('lust'),ln=lr?pct(lr):null,lust=ln!==null?ln+'%':(lr||'-');
    const sp=raw('sexPosition'),sfw=!sp||/^(n\/?a|-|없음|sfw)$/i.test(sp);
    const con=/^(착용|on|true|1|o|yes)$/i.test(raw('condom'));
    const dot=`<span class="${p}-dot">·</span>`;
    const sex=`<span class="${p}-lust">${E(lust)}</span>${dot}`+(sfw
      ?`<span class="${p}-empty" style="letter-spacing:2px;font-weight:700">N/A · SFW</span>`
      :`<span><i>POS</i>${E(sp)}</span>${dot}<span><i>CONDOM</i><span class="${p}-pill${con?' on':''}">${con?'ON':'OFF'}</span></span>${dot}<span${cfg.climax?` class="${p}-climax"`:''}>${E((raw('npcClimax')||'0')+' : '+(raw('pcClimax')||'0'))}</span>`);
    P.status+=`<div><div class="${p}-lbl">NSFW</div><div class="${p}-box" style="white-space:normal;display:flex;flex-direction:column;gap:8px"><div class="${p}-sex">${sex}</div></div></div>`;
  }
  const cm=nlv(a.communityComments).split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length).map(b=>({h:b.length>1?b[0]:'',b:(b.length>1?b.slice(1):b).join(' ')}));
  P.community=`<span class="${p}-badge">BABYLON</span><div class="${p}-comm-t">${or('communityTitle','-')}</div>`+cm.map(c=>`<div class="${p}-cmt">${c.h?`<div class="${p}-cmt-h">${E(c.h)}</div>`:''}<div class="${p}-cmt-b">${E(c.b)}</div></div>`).join('');
  P.interview=`<div class="${p}-q"><b>Q.</b>${or('interviewQ','-')}</div><div class="${p}-a"><b>A.</b>${or('interviewA','-')}</div>`+(cfg.tr&&raw('interviewATr')?`<div class="${p}-atr">(${v('interviewATr')})</div>`:'');
  const id=a._id,tabs=cfg.tabs;
  const tabArea=tabs.map(([k],i)=>`<input type="radio" name="${id}" id="${id}-${k}" class="${p}-r r-${k}"${i?'':' checked'}>`).join('')
    +`<div class="${p}-tabs">${tabs.map(([k,l])=>`<label for="${id}-${k}" class="${p}-tab tb-${k}">${l}</label>`).join('')}</div><div class="${p}-tabline"></div>`
    +`<div class="${p}-panel">${tabs.map(([k])=>`<div class="pn pn-${k}">${P[k]}</div>`).join('')}</div>`;
  const head=`<summary class="${p}-sum"><div class="${p}-head"><div class="${p}-htop"><div class="${p}-title">${cfg.title}</div><span class="${p}-arrow"><span class="lc">▼</span><span class="lo">▲</span></span></div>${meta?`<div class="${p}-meta">${meta}</div>`:''}${loc?`<div class="${p}-meta">${E(loc)}</div>`:''}</div></summary>`;
  const body=`<div class="${p}-body"><div class="${p}-inner"><div class="${p}-chips">${chips}</div><div class="${p}-emo"><div class="c">${or('npcKaomoji','-')}</div>${cfg.mid||'<span>♥</span>'}<div class="u">${or('pcKaomoji','-')}</div></div><div>${tabArea}</div></div></div>`;
  const common=`.${p}-det>summary{list-style:none}.${p}-det>summary::-webkit-details-marker{display:none}.${p} .lo{display:none}.${p}-det[open] .lo{display:inline}.${p}-det[open] .lc{display:none}.${p}-det[open] .${p}-head{border-radius:3px 3px 0 0}.${p}-r{display:none}.${p}-tab{display:block;text-align:center;user-select:none}.${p}-panel{display:block}.${p} .pn{display:none;flex-direction:column;gap:12px}`
    +tabs.map(([k])=>`.${p}-r.r-${k}:checked~.${p}-panel .pn-${k}{display:flex}.${p}-r.r-${k}:checked~.${p}-tabs .tb-${k}{${cfg.on}}`).join('');
  return `[html]\n<style>${cfg.css}${common}</style><div class="${p}"><details class="${p}-det">${head}${body}</details></div>\n[/html]`;
}

.amd-q b,.amd-a b{color:var(--red);margin-right:6px}

.amd-atr{color:var(--mute);padding-left:20px;margin-top:-6px}
.amd-empty{color:#6e5a5e}
`};

  p:'tdg',NPC:'RAYMOND',PC:'ALEX',icon:'🐯',title:'#雙犬 — RAYMOND + ALEX',nsfw:false,tr:true,mid:'<span class="vs">VS</span>',
  tabs:[['status','STATUS'],['community','COM'],['interview','INT']],

  css:`@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable.css');
.tdg{--red:#c4180c;--red-d:#4a0805;--bg:#0e0b0c;--bg2:#110d0e;--card:#15100f;--card2:#120d0e;--chip:#181214;--line:#3c2a2f;--ink:#f5e9ea;--ink2:#f0e4e6;--txt:#d8c9cb;--mute:#a3898d;--dark:#1c1013;font-family:'Pretendard Variable',Pretendard,'맑은 고딕','Malgun Gothic',sans-serif;max-width:440px;margin:auto;box-sizing:border-box;word-break:keep-all;overflow-wrap:break-word;color:var(--txt);font-size:12px;line-height:normal;letter-spacing:0;text-align:left}

.tdg-meta{font-size:11px;font-weight:bold;color:var(--txt);letter-spacing:-.2px;margin-bottom:4px}

.tdg-q b,.tdg-a b{color:var(--red);margin-right:6px}
.tdg-a{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.6}

/* ───────── 상태창 목록: 새 상태창은 여기에 한 줄 추가 ───────── */
const TPL={
  Apogee:a=>apogeeHtml(a),
  SN:a=>boxHtml(SN_CFG,a),
  Amond:a=>boxHtml(AMD_CFG,a),
  Twodogs:a=>boxHtml(TDG_CFG,a),
};

function renderStatus(s){
  const k=force!=='auto'&&TPL[force]?force:s.tag;
  return TPL[k](s.a);
}

function render(){
  raw=blocks.map(b=>{
    if(b.t==='x')return b.s;
    if(b.t==='st')return b.s?renderStatus(b.s):'';
    const c=chars.get(b.n);
    const line=paintQ(b.l,c),nm=c.label||b.n;
    const head=b.n===NONAME?line:`${c.nc?`{{${c.size}:{{${c.color}:${nm}}}}}`:nm} | ${line}`;
    return head+(b.tr!==null?`\n{{${c.size}:{{${c.color}:**${b.tr}**}}}}`:'');
  }).join('\n').trim();
  $('out').innerHTML=preview(raw);
}

// 대사 꾸미기 종류
const MODES=[['none','꾸미지 않음'],['bold','굵게'],['color','글자 색'],['colorbold','글자 색 + 굵게']];
const MODE_OPTS=MODES.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');
function deco(m,c){
  if(c.mode==='bold')return `**${m}**`;
  if(c.mode==='color')return `{{${c.size}:{{${c.color}:${m}}}}}`;
  if(c.mode==='colorbold')return `{{${c.size}:{{${c.color}:**${m}**}}}}`;
  return m;
}
// "대사" 부분에만 꾸미기 (따옴표가 안 닫혀 있으면 줄 전체)
function paintQ(s,c){
  if(!c.mode||c.mode==='none')return s;
  const re=/"[^"\n]*"|“[^”\n]*”|「[^」\n]*」|『[^』\n]*』/g;
  return re.test(s)?s.replace(re,m=>deco(m,c)):deco(s,c);
}

function preview(t){
  return t.split(/(\[html\][\s\S]*?\[\/html\])/).map(p=>{
    if(/^\[html\]/.test(p))return '<div class="hb">'+p.slice(6,-7)+'</div>';
    const x=p.replace(/^\n+|\n+$/g,'');
    return x?`<div class="tx">${esc(x)}</div>`:'';
  }).join('');
}

function buildOptions(){
  const box=$('chars'),keys=[...chars.keys()];
  box.innerHTML='';
  if(!keys.length){box.innerHTML='<div class="empty">등장인물을 찾지 못했어요. 이름 | "대사" 또는 "대사" 형식인지 확인해 주세요.</div>';return}
  keys.forEach((k,i)=>{
    const c=chars.get(k),d=document.createElement('div');
    d.className='char';d.dataset.i=i;d.style.animationDelay=(i*60)+'ms';
    d.innerHTML='<div class="cn"></div><input type="text" class="f-name" aria-label="이름"><div class="row"><label>색<input type="color" class="f-color"></label><label>크기<input type="number" class="f-size" min="8" max="48" inputmode="numeric"></label></div><div class="row"><label>"대사" 꾸미기<select class="f-mode">'+MODE_OPTS+'</select></label><label class="w-nc">이름 색<select class="f-nc"><option value="0">기본</option><option value="1">이 색으로</option></select></label></div><div class="pv"><span class="pv-n"></span><span class="pv-sep"> | </span><span class="pv-t">"미리보기"</span></div><div class="tip" style="color:var(--sub);margin-top:4px">(번역) 줄이 있으면 번역에는 이 색이 들어가요.</div>';
    const nm=d.querySelector('.f-name');
    if(k===NONAME){d.querySelector('.cn').textContent='이름 없는 대사 ("대사"만 있는 줄)';['.f-name','.w-nc','.pv-n','.pv-sep'].forEach(s=>d.querySelector(s).style.display='none')}
    else{d.querySelector('.cn').textContent='원본 이름 · '+k;nm.value=c.label}
    d.querySelector('.f-color').value=c.color;
    d.querySelector('.f-size').value=c.size;
    d.querySelector('.f-mode').value=c.mode;
    d.querySelector('.f-nc').value=c.nc?'1':'0';
    box.appendChild(d);paint(d,c);
  });
}
function paint(d,c){
  const t=d.querySelector('.pv-t'),n=d.querySelector('.pv-n');
  t.style.color=c.mode==='color'||c.mode==='colorbold'?c.color:'var(--ink)';
  t.style.fontWeight=c.mode==='bold'||c.mode==='colorbold'?'700':'400';
  n.textContent=c.label;n.style.color=c.nc?c.color:'var(--ink)';n.style.fontWeight='400';
  d.querySelector('.pv-sep').style.fontWeight='400';
}

const onOpt=e=>{
  const d=e.target.closest('.char');if(!d)return;
  const c=chars.get([...chars.keys()][d.dataset.i]);
  c.label=d.querySelector('.f-name').value;
  c.color=d.querySelector('.f-color').value.toLowerCase();
  c.size=parseInt(d.querySelector('.f-size').value)||12;
  c.mode=d.querySelector('.f-mode').value;
  c.nc=d.querySelector('.f-nc').value==='1';
  paint(d,c);render();
};
$('chars').addEventListener('input',onOpt);
$('chars').addEventListener('change',onOpt);

// 상태창 디자인 선택
(()=>{
  const sel=$('tpl');
  sel.innerHTML='<option value="auto">자동 (태그 이름대로)</option>'+Object.keys(TPL).map(k=>`<option value="${k}">${k}</option>`).join('');
  sel.addEventListener('change',()=>{force=sel.value;if(blocks.length)render()});
})();
// 대사 꾸미기 전체 설정
let gmode='bold';
(()=>{
  const sel=$('gmode');
  sel.innerHTML=MODE_OPTS;sel.value=gmode;
  sel.addEventListener('change',()=>{
    gmode=sel.value;chars.forEach(c=>c.mode=gmode);
    if(chars.size)buildOptions();
    if(blocks.length)render();
  });
})();
function showFound(){
  const f=[...new Set(blocks.filter(b=>b.t==='st').map(b=>b.s.tag))];
  $('tplinfo').textContent=f.length?'찾은 상태창: '+f.join(', '):'상태창 태그를 찾지 못했어요.';
}

function flash(btn,text){
  const o=btn.dataset.o||(btn.dataset.o=btn.textContent);
  btn.textContent=text;btn.classList.add('done');
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.textContent=o;btn.classList.remove('done')},1800);
}

$('go').addEventListener('click',()=>{
  const src=$('src').value;if(!src.trim())return;
  blocks=parse(src);
  const next=new Map();let i=0;
  blocks.forEach(b=>{if(b.t==='d'&&!next.has(b.n)){next.set(b.n,chars.get(b.n)||{label:b.n===NONAME?'':b.n,color:PAL[i%PAL.length],size:12,mode:gmode,nc:false});i++}});
  chars=next;buildOptions();showFound();render();
  flash($('go'),'완료 ✓');
});

$('cp').addEventListener('click',async()=>{
  if(!raw)return;
  try{await navigator.clipboard.writeText(raw)}catch(e){const t=document.createElement('textarea');t.value=raw;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();}
  flash($('cp'),'복사됨 ✓');
});
</script>
</body>
